name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install fastapi==0.133.1 pydantic==2.12.5 uvicorn==0.54.0 httpx==0.28.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: |
          python -m uvicorn dev.server:app --host 127.0.0.1 --port 18765 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18765/ && break; sleep 1; done
          npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
