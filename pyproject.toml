[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-slide-studio"
version = "0.1.0"
description = "Slide Studio backend for Hermes Desktop"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3"]
classifiers = ["Operating System :: POSIX"]

[tool.setuptools]
packages = ["slide_studio"]

[tool.setuptools.package-dir]
slide_studio = "."

[tool.setuptools.package-data]
slide_studio = ["plugin.yaml", "dashboard/*.py", "dashboard/*.json", "desktop/*.js"]
